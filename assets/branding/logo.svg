      <stop offset="0.5" stop-color="#1457DF"/>
      <stop offset="1" stop-color="#0731B8"/>
    </linearGradient>
    <linearGradient id="ice-blue-gradient" gradientUnits="userSpaceOnUse" x1="380" y1="530" x2="730" y2="950">
      <stop offset="0" stop-color="#DFF7FF"/>
      <stop offset="0.5" stop-color="#A8DFF8"/>
      <stop offset="1" stop-color="#66B4E6"/>
    </linearGradient>
    <linearGradient id="mint-green-gradient" gradientUnits="userSpaceOnUse" x1="520" y1="445" x2="865" y2="880">
      <stop offset="0" stop-color="#C4FFEB"/>
      <stop offset="0.5" stop-color="#77EBC6"/>
      <stop offset="1" stop-color="#2CC79B"/>
    </linearGradient>
  </defs>
