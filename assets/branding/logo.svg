<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="900" viewBox="-25 159 1260 900" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">文件云同步 Logo</title>
  <desc id="logo-description">以参考图鲜亮蓝色为基调的渐变云朵，配一层向左上方明显错位展开的浅蓝云朵叠层，中央为珍珠白与浅柠檬色渐变双箭头。圆环与箭头使用小圆角及相切曲线，保持顺时针方向和尾部对齐。横向矩形画布，减少上下留白。透明背景，所有形状均为可编辑纯矢量路径，云朵和双箭头均保留渐变。</desc>
  <defs>
    <linearGradient id="cloud-gradient" gradientUnits="userSpaceOnUse" x1="260" y1="244" x2="1050" y2="1026">
      <stop offset="0" stop-color="#0C60F1"/>
      <stop offset="0.5" stop-color="#004DE5"/>
      <stop offset="1" stop-color="#0039CA"/>
    </linearGradient>
    <linearGradient id="pearl-gradient" gradientUnits="userSpaceOnUse" x1="380" y1="530" x2="730" y2="950">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.5" stop-color="#F2F6FA"/>
      <stop offset="1" stop-color="#E1EBF6"/>
    </linearGradient>
    <linearGradient id="lemon-gradient" gradientUnits="userSpaceOnUse" x1="520" y1="445" x2="865" y2="880">
      <stop offset="0" stop-color="#FBFFE2"/>
      <stop offset="0.5" stop-color="#ECF9C6"/>
      <stop offset="1" stop-color="#DCF0A5"/>
    </linearGradient>
    <linearGradient id="cloud-depth-gradient" gradientUnits="userSpaceOnUse" x1="260" y1="244" x2="1050" y2="1044">
      <stop offset="0" stop-color="#5794FA"/>
      <stop offset="1" stop-color="#2E60D8"/>
    </linearGradient>
  </defs>
