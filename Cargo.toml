# 虚拟 workspace 根清单：只放成员、共享包字段与 lint 策略，不放包本身（docs/design.md §5.2、§5.7）。
# 每张卡只加入真实存在的成员，避免为空目录预建 crate 占位。
[workspace]
resolver = "3"
# tests/windows-integration 是 design §5.8 指定的 Windows 原生测试包（S009 起）：
# 只在宿主用 `nix develop .#windows` + `cargo xwin build` 交叉编译，因此不进 default-members。
# tests/server-integration 是服务端集成测试包（S037 起，design §5.8）：用真实文件的 inode/替换
# 语义模拟工作目录发布，并在每个持久化边界强杀提交子进程，因此同样不进 default-members。
# crates/platform-linux-server 是服务端 Linux 平台适配层（S013 起），只在 Linux 上编译；
# 它的挂载准入需要直接调用 fstatfs/statx/ioctl，因此同样不进 default-members。
# apps/server 是 Linux 服务端进程入口（S041，design §5.3）：它只在 Linux 上编译（非 Linux
# 目标直接 compile_error!），因此进 members 但**不进** default-members，便携检查（含 Windows
# 默认目标）不会构建服务端应用。
members = [
    "apps/server",
    "crates/client-store",
    "crates/domain",
    "crates/fs-common",
    "crates/local-ipc",
    "crates/planner",
    "crates/platform-linux-server",
    "crates/protocol",
    "crates/server-core",
    "crates/server-store",
    "crates/platform-windows",
    "tests/server-integration",
    "tests/windows-integration",
    "tools/xtask",
]
# crates/protocol 是 api/openapi.yaml 生成的 wire 契约与 domain→wire 显式映射（S024），只依赖
# serde 与 domain，Windows 客户端与 Linux 服务端共用，因此同样进 default-members：两侧编译与
# 契约测试都在便携检查里跑。
#
# crates/local-ipc 是本机 IPC 的 wire 契约、协议版本与消息帧（S025）：只依赖 serde，不含平台
# 传输（命名管道在 crates/platform-windows），任何宿主目标都能编译与测试，因此也进
# default-members，让帧上限、部分读取与命令解码的回归进入便携检查。
# crates/planner 是纯规则的三方比较与计划核心（S019），只依赖 domain 与 fs-common，不做任何
# I/O，因此同样进 default-members。
#
# crates/server-store 是服务端 SQLite 存储层（S026）：依赖 SQLx/Tokio 与 bundled SQLite，
# 没有任何平台 API，任何宿主目标都能编译与测试，因此进 default-members，让迁移框架的回归进入
# 便携检查（`cargo xtask check`/CI 的 `cargo test --locked`）。它不引入前端或客体依赖。
#
# crates/server-core 是服务端用例核心（S033）：不可变内容对象的写入/读取规则与服务端端口
# 契约，不做平台 I/O，也没有第三方依赖；任何宿主目标都能编译与测试，因此同样进
# default-members，让“独立 inode/长度/摘要/发布后复核”的规则回归进入便携检查。
#
# crates/client-store 是客户端 SQLite 存储层（S030）：同样只有 SQLx + domain，没有任何平台 API，
# 因此也进 default-members；客户端库的种类与 schema 门禁、三张条目表并存的组合都能在便携检查里
# 回归。它与 server-store 之间没有依赖：两套 schema、两个数据库文件（design §7.3）。
#
# default-members 只选可移植核心：`cargo test --locked`/`cargo clippy` 不构建 xtask 等编排工具，
# 也不构建只能在 Windows 上运行的测试包与平台适配层（crates/platform-windows 的 Windows 目标
# 代码只有交叉构建 + 客体运行才能验证），保证便携检查（含 Windows 与 CI 的默认目标）不受影响。
default-members = [
    "crates/client-store",
    "crates/domain",
    "crates/fs-common",
    "crates/local-ipc",
    "crates/planner",
    "crates/protocol",
    "crates/server-core",
    "crates/server-store",
]

[workspace.package]
# edition 2024 在 Rust 1.85.0 稳定，据此把 rust-version 定为 1.85.0（实测见 agent/tasks/S004.md）。
edition = "2024"
rust-version = "1.85.0"
version = "0.1.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
