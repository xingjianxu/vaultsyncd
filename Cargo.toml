# 虚拟 workspace 根清单：只放成员、共享包字段与 lint 策略，不放包本身（docs/design.md §5.2、§5.7）。
# 每张卡只加入真实存在的成员，避免为空目录预建 crate 占位。
[workspace]
resolver = "3"
# tests/windows-integration 是 design §5.8 指定的 Windows 原生测试包（S009 起）：
# 只在宿主用 `nix develop .#windows` + `cargo xwin build` 交叉编译，因此不进 default-members。
# crates/platform-linux-server 是服务端 Linux 平台适配层（S013 起），只在 Linux 上编译；
# 它的挂载准入需要直接调用 fstatfs/statx/ioctl，因此同样不进 default-members。
members = [
    "crates/domain",
    "crates/fs-common",
    "crates/platform-linux-server",
    "crates/platform-windows",
    "tests/windows-integration",
    "tools/xtask",
]
# default-members 只选可移植核心：`cargo test --locked`/`cargo clippy` 不构建 xtask 等编排工具，
# 也不构建只能在 Windows 上运行的测试包与平台适配层（crates/platform-windows 的 Windows 目标
# 代码只有交叉构建 + 客体运行才能验证），保证便携检查（含 Windows 与 CI 的默认目标）不受影响。
default-members = ["crates/domain", "crates/fs-common"]

[workspace.package]
# edition 2024 在 Rust 1.85.0 稳定，据此把 rust-version 定为 1.85.0（实测见 agent/tasks/S004.md）。
edition = "2024"
rust-version = "1.85.0"
version = "0.1.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
