[package]
name = "vaultsyncd-server-tests"
description = "服务端集成测试（design §5.8）：提交与启动恢复的崩溃注入验收（S037）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 只放 Linux 服务端的集成验收：用真实文件的 inode/替换语义模拟工作目录发布，并在每个持久化边界
# 强杀提交子进程（design §21.2、T23）。它不进 default-members：`cargo test --locked` 只跑可移植
# 核心，本包按需用 `cargo test --locked -p vaultsyncd-server-tests` 执行。
[lints]
workspace = true

[dependencies]
vaultsyncd-domain = { path = "../../crates/domain" }
vaultsyncd-server-core = { path = "../../crates/server-core" }
tokio = { version = "1", features = ["macros", "rt"] }
