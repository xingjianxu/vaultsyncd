[package]
name = "vaultsyncd-e2e"
description = "跨进程场景编排器：真实 Linux 服务端 + Windows 客户端经 HTTPS 与 named pipe 驱动（docs/design.md §5.8）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 编排器只在 Windows 客体上运行（CFAPI/WinCred/named pipe），场景校验与响应丢失代理是
# 可移植代码，因此本包可以进 members 但不进 default-members：宿主 `cargo test -p
# vaultsyncd-e2e` 只跑数据与代理规则测试，Windows 构建用 `nix develop .#windows` 交叉编译。
[dependencies]
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
vaultsyncd-domain = { path = "../../crates/domain" }
vaultsyncd-http-client = { path = "../../crates/http-client" }
vaultsyncd-local-ipc = { path = "../../crates/local-ipc" }
vaultsyncd-protocol = { path = "../../crates/protocol" }
vaultsyncd-transfer = { path = "../../crates/transfer" }

[target.'cfg(windows)'.dependencies]
vaultsyncd-platform-windows = { path = "../../crates/platform-windows" }

[lints]
workspace = true
