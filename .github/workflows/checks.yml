# 便携检查 CI（Linux runner）：与本地 `cargo xtask check` 使用同一套命令
# （docs/design.md §5.2「检查逻辑保留在 xtask」、§5.8 变更范围表）。
# 工具链版本不在此重复声明：Rust 由 rust-toolchain.toml 决定，Node 由 package.json 的
# engines.node 决定，pnpm 由 package.json 的 packageManager 决定。
# 平台矩阵、安装包与 Windows 原生验证留给后续卡（S101），本文件只做便携检查。
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-checks:
    name: portable checks (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 先装 pnpm：setup-node 的 pnpm 缓存依赖它已存在。
      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@v4

      - name: Install Node.js from engines.node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      # rustup 随 runner 镜像预装；rustup show 读取 rust-toolchain.toml，
      # 缺失时自动安装该版本并按 components 装上 rustfmt/clippy。
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 与本地一致的入口：cargo fmt --check、clippy、cargo test --locked、前端 typecheck。
      - name: Run portable checks
        run: cargo xtask check
