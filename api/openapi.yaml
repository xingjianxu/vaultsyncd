# vaultsyncd 远端 HTTP API 的唯一编辑源（docs/design.md §5.6、§15.1—15.4）。
#
# 本文件只描述 wire 契约：改名、改类型、加字段都从这里开始，再运行 `cargo xtask generate`
# 更新 Rust DTO（crates/protocol）与 TypeScript 客户端（packages/api-client）。生成代码不手改。
#
# 本卡（S024）只冻结最小契约：健康探测、能力协商、错误信封与十进制长整数字符串。其余端点按
# design §15.2 的清单在各自功能卡中逐个加入；生成器对本文件未支持的构造明确报错，不会静默
# 跳过，因此不会出现“写了但没生成”的端点。
openapi: "3.1.0"

info:
  title: vaultsyncd remote API
  version: "0.1.0"
  description: |
    服务端远端接口的首发草案（/v1）。JSON 使用 snake_case；所有清单分页有上限；未知枚举
    不当作默认成功。健康探测与能力协商不需要身份认证，其余端点需要会话，按 design §15.2
    在对应功能卡加入。

paths:
  /v1/auth/browser/login:
    post:
      operationId: browserLogin
      summary: 浏览器登录
      description: 同源 HttpOnly cookie 会话；浏览器响应不包含令牌。改密和全部撤销成功后须重新登录。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: 操作完成
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrowserSession"}
        "401":
          description: 凭据无效或会话失效
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: 跨源请求被拒绝
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}

  /v1/auth/browser/refresh:
    post:
      operationId: browserRefresh
      summary: 浏览器刷新
      description: 同源 HttpOnly cookie 会话；浏览器响应不包含令牌。改密和全部撤销成功后须重新登录。
      responses:
        "200":
          description: 操作完成
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrowserSession"}
        "401":
          description: 凭据无效或会话失效
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: 跨源请求被拒绝
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}

  /v1/auth/account:
    get:
      operationId: getAccount
      summary: 当前账号
      description: 同源 HttpOnly cookie 会话；浏览器响应不包含令牌。改密和全部撤销成功后须重新登录。
      responses:
        "200":
          description: 操作完成
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountInfo"}
        "401":
          description: 凭据无效或会话失效
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: 跨源请求被拒绝
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}

  /v1/auth/password:
    post:
      operationId: changePassword
      summary: 修改密码
      description: 同源 HttpOnly cookie 会话；浏览器响应不包含令牌。改密和全部撤销成功后须重新登录。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordChangeRequest"}
      responses:
        "200":
          description: 操作完成
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountChanged"}
        "401":
          description: 凭据无效或会话失效
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: 跨源请求被拒绝
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}

  /v1/auth/revoke-all:
    post:
      operationId: revokeAllSessions
      summary: 撤销全部会话
      description: 同源 HttpOnly cookie 会话；浏览器响应不包含令牌。改密和全部撤销成功后须重新登录。
      responses:
        "200":
          description: 操作完成
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountChanged"}
        "401":
          description: 凭据无效或会话失效
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: 跨源请求被拒绝
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}

  /v1/roots/{root}/entries/{entry}/history:
    get:
      operationId: listEntryHistory
      summary: 列出条目历史版本
      description: 需要 Root 授权；按版本身份分页，最多100条，不泄露服务器路径。
      parameters:
        - name: root
          in: path
          required: true
          schema: {type: string}
        - name: entry
          in: path
          required: true
          schema: {type: string}
        - name: after
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: 一页历史
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecoveryPage"}
        "400":
          description: 参数错误
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: 没有 Root 授权
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: 条目不存在
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /v1/roots/{root}/trash:
    get:
      operationId: listTrash
      summary: 列出回收站
      description: 需要 Root 授权；按条目身份分页，最多100条，仅返回仍保留的回收站事实。
      parameters:
        - name: root
          in: path
          required: true
          schema: {type: string}
        - name: after
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: 一页回收站
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecoveryPage"}
        "400":
          description: 参数错误
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: 没有 Root 授权
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /v1/health:
    get:
      operationId: getHealth
      summary: 健康探测
      description: |
        无需认证的存活与健康状态探测。服务端仍可用 503 报告需要恢复等不可用状态，
        此时响应体是标准错误信封。
      responses:
        "200":
          description: 服务端可接受请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 服务端暂不可用（例如需要恢复）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: 能力协商
      description: |
        返回协议版本、服务器身份、epoch、功能集合与限额，供客户端显式协商。不泄露任何
        服务器目录路径。
      responses:
        "200":
          description: 当前协议版本与能力
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "503":
          description: 服务端暂不可用（例如需要恢复）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/auth/login:
    post:
      operationId: login
      summary: 登录
      description: |
        用登录名与密码换一对凭据（design §15.2、§17.1）。失败一律 401，不区分“账号不存在”
        与“密码不对”；触发限流时 429。浏览器走同源 HttpOnly cookie，agent 把响应里的凭据
        存入 OS 凭据库或权限受限的凭据文件（见 docs/adr/0001-auth-credential-carriers.md）。
        响应不带服务器绝对路径。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功，返回一对凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionIssued"
        "401":
          description: 凭据无效（不区分账号不存在与密码不对）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 跨源 cookie 写请求被拒绝
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: 登录尝试过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/auth/refresh:
    post:
      operationId: refresh
      summary: 刷新会话凭据
      description: |
        用刷新凭据换新的一对凭据（design §15.2）。轮换是原子的：旧会话随即失效，同一个刷新
        凭据不能再用。被用过或已撤销的刷新凭据一律 401，不回放后继凭据。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 轮换成功，返回新的凭据对
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionIssued"
        "401":
          description: 刷新凭据无效、过期、已撤销或已被使用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/auth/logout:
    post:
      operationId: logout
      summary: 注销当前会话
      description: |
        失效当前会话的凭据（design §15.2）。只动服务端会话，不清理任何本地文件；重复注销是
        幂等的。
      responses:
        "200":
          description: 会话已失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevoked"
        "401":
          description: 没有可用凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/roots:
    get:
      operationId: listRoots
      summary: 授权 Root 清单
      description: |
        列出当前调用者可见的 Root 及其健康状态（design §15.2）。响应只有身份与状态：
        普通客户端不获得服务器绝对路径，管理面要用路径时走本机或管理员通道。
      responses:
        "200":
          description: 当前调用者的 Root 清单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootList"
        "401":
          description: 没有可用凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 服务端存储不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/admin/roots:
    post:
      operationId: registerRoot
      summary: 注册 Root
      description: |
        注册一个服务端工作目录（design §11.4、§15.2）。只接受部署配置里预置的允许基目录内的
        普通目录；后端不是本地 btrfs（FUSE、占位/按需回源视图等）、路径与已注册 Root 或内部
        状态目录重叠、以及扫描内无法证明合规的目录一律拒绝。注册只读探测，不改写、不清空、
        不导入既有文件；初始采集是后续步骤，因此响应报告“待导入”。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RootRegisterRequest"
      responses:
        "200":
          description: 已注册（既有文件未被改动）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootRegistered"
        "401":
          description: 没有可用凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 路径不在允许基目录内，或没有管理权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: 目录不是可注册的普通存储（配置阶段拒绝）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 服务端存储不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/roots/{root}/uploads:
    post:
      operationId: beginUpload
      summary: 创建上传会话
      description: |
        为一个不可变本地快照申请上传会话（design §13.1—13.2、§15.2）。会话绑定总大小与总
        SHA-256，块大小由服务端决定并随会话返回；同一会话重复申请不会创建第二个身份。
        会话与签发它的登录会话、授权 Root 绑定，容量与总大小上限由服务端限定。
      parameters:
        - name: root
          in: path
          required: true
          description: 授权 Root 的身份（32 位小写十六进制）。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "201":
          description: 已创建上传会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "400":
          description: 请求形状不合法（哈希不是 64 位小写十六进制、大小越界）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 没有可用会话凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Root 不在调用方授权范围（不区分不存在与越权）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "507":
          description: 服务端空间或会话容量不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 服务端不可用（例如需要恢复）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/roots/{root}/uploads/{upload}:
    get:
      operationId: getUpload
      summary: 查询上传进度
      description: |
        返回会话状态与**服务端真实已收块**，客户端的续传依据是这里的结果而不是自己记录的位图
        （design §13.2「查询已收块」）。已收块的哈希与长度都来自持久化记录。
      parameters:
        - name: root
          in: path
          required: true
          description: 授权 Root 的身份（32 位小写十六进制）。
          schema:
            type: string
        - name: upload
          in: path
          required: true
          description: 上传会话身份（32 位小写十六进制）。
          schema:
            type: string
      responses:
        "200":
          description: 会话状态与已收块
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatus"
        "401":
          description: 没有可用会话凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Root 不在调用方授权范围
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: 会话不存在、不属于该 Root 或不属于该登录会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 服务端不可用（例如需要恢复）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/roots/{root}/uploads/{upload}/parts/{index}:
    put:
      operationId: putUploadPart
      summary: 上传一个固定块
      description: |
        按会话的块几何上传第 `index` 块原始字节（design §13.1、§15.2）。请求体是
        `application/octet-stream`；块长度必须等于会话几何给出的期望长度，`x-part-sha256`
        头给出该块的小写十六进制 SHA-256。服务端先把字节落到私有暂存并持久化，再登记该块；
        同一索引重传必须字节一致（幂等返回既有记录），不一致一律拒绝，不能把两个本地
        generation 的字节混进一个会话。
      parameters:
        - name: root
          in: path
          required: true
          description: 授权 Root 的身份（32 位小写十六进制）。
          schema:
            type: string
        - name: upload
          in: path
          required: true
          description: 上传会话身份（32 位小写十六进制）。
          schema:
            type: string
        - name: index
          in: path
          required: true
          description: 块索引（从 0 起的十进制文本）。
          schema:
            type: string
            format: decimal_u64
        - name: x-part-sha256
          in: header
          required: true
          description: |
            该块原始字节的 SHA-256（64 位小写十六进制），与该块字节分开传：服务端先核对再登记。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "200":
          description: 块已登记（首次或幂等重传）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartAck"
        "400":
          description: 块索引越界、长度与几何不符或载荷超过上限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 没有可用会话凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Root 不在调用方授权范围或会话属于其他登录会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: 会话不存在或不属于该 Root
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: 同一块索引已登记不同字节
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: 块内容与声明的 SHA-256 或长度不符
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 服务端不可用（例如需要恢复）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "507":
          description: 暂存空间不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/roots/{root}/uploads/{upload}/finalize:
    post:
      operationId: finalizeUpload
      summary: 完成上传并发布内容
      description: |
        按块几何核对收齐后拼装并发布内容对象（design §13.1—13.2、§15.2）。顺序固定为
        “核对块齐 → 标 complete → 拼装并发布对象 → 核对总长度与总 SHA-256 → 登记对象 →
        标 finalized”。

        本端点**不提交条目**：它只返回可提交内容引用（`hash`/`size`/`storage_path`），条目的
        head 由后续 put/create 操作按 CAS 提交（I01：finalize 成功不等于同步完成）。

        块未收齐时不改会话状态，直接 400；拼装内容与快照声明不符时放弃会话
        （`aborted`）并返回 422，不登记对象（I05）。已 `finalized` 的会话重复调用是幂等重放：
        返回同一内容引用与 `replayed=true`，不重新发布。
      parameters:
        - name: root
          in: path
          required: true
          description: 授权 Root 的身份（32 位小写十六进制）。
          schema:
            type: string
        - name: upload
          in: path
          required: true
          description: 上传会话身份（32 位小写十六进制）。
          schema:
            type: string
      responses:
        "200":
          description: 内容已发布（首次或幂等重放），返回可提交内容引用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizedContent"
        "400":
          description: 身份/形状不合法，或块还没有收齐（不改会话状态）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 没有可用会话凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Root 不在调用方授权范围
          content:
