# vaultsyncd 远端 HTTP API 的唯一编辑源（docs/design.md §5.6、§15.1—15.4）。
#
# 本文件只描述 wire 契约：改名、改类型、加字段都从这里开始，再运行 `cargo xtask generate`
# 更新 Rust DTO（crates/protocol）与 TypeScript 客户端（packages/api-client）。生成代码不手改。
#
# 本卡（S024）只冻结最小契约：健康探测、能力协商、错误信封与十进制长整数字符串。其余端点按
# design §15.2 的清单在各自功能卡中逐个加入；生成器对本文件未支持的构造明确报错，不会静默
# 跳过，因此不会出现“写了但没生成”的端点。
openapi: "3.1.0"

info:
  title: vaultsyncd remote API
  version: "0.1.0"
  description: |
    服务端远端接口的首发草案（/v1）。JSON 使用 snake_case；所有清单分页有上限；未知枚举
    不当作默认成功。健康探测与能力协商不需要身份认证，其余端点需要会话，按 design §15.2
    在对应功能卡加入。

paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: 健康探测
      description: |
        无需认证的存活与健康状态探测。服务端仍可用 503 报告需要恢复等不可用状态，
        此时响应体是标准错误信封。
      responses:
        "200":
          description: 服务端可接受请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 服务端暂不可用（例如需要恢复）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: 能力协商
      description: |
        返回协议版本、服务器身份、epoch、功能集合与限额，供客户端显式协商。不泄露任何
        服务器目录路径。
      responses:
        "200":
          description: 当前协议版本与能力
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "503":
          description: 服务端暂不可用（例如需要恢复）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/auth/login:
    post:
      operationId: login
      summary: 登录
      description: |
        用登录名与密码换一对凭据（design §15.2、§17.1）。失败一律 401，不区分“账号不存在”
        与“密码不对”；触发限流时 429。浏览器走同源 HttpOnly cookie，agent 把响应里的凭据
        存入 OS 凭据库或权限受限的凭据文件（见 docs/adr/0001-auth-credential-carriers.md）。
        响应不带服务器绝对路径。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功，返回一对凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionIssued"
        "401":
          description: 凭据无效（不区分账号不存在与密码不对）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 跨源 cookie 写请求被拒绝
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: 登录尝试过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/auth/refresh:
    post:
      operationId: refresh
      summary: 刷新会话凭据
      description: |
        用刷新凭据换新的一对凭据（design §15.2）。轮换是原子的：旧会话随即失效，同一个刷新
        凭据不能再用。被用过或已撤销的刷新凭据一律 401，不回放后继凭据。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 轮换成功，返回新的凭据对
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionIssued"
        "401":
          description: 刷新凭据无效、过期、已撤销或已被使用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/auth/logout:
    post:
      operationId: logout
      summary: 注销当前会话
      description: |
        失效当前会话的凭据（design §15.2）。只动服务端会话，不清理任何本地文件；重复注销是
        幂等的。
      responses:
        "200":
          description: 会话已失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevoked"
        "401":
          description: 没有可用凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/roots/{root}/uploads:
    post:
      operationId: beginUpload
      summary: 创建上传会话
      description: |
        为一个不可变本地快照申请上传会话（design §13.1—13.2、§15.2）。会话绑定总大小与总
        SHA-256，块大小由服务端决定并随会话返回；同一会话重复申请不会创建第二个身份。
        会话与签发它的登录会话、授权 Root 绑定，容量与总大小上限由服务端限定。
      parameters:
        - name: root
          in: path
          required: true
          description: 授权 Root 的身份（32 位小写十六进制）。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "201":
          description: 已创建上传会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "400":
          description: 请求形状不合法（哈希不是 64 位小写十六进制、大小越界）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 没有可用会话凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Root 不在调用方授权范围（不区分不存在与越权）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "507":
          description: 服务端空间或会话容量不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 服务端不可用（例如需要恢复）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/roots/{root}/uploads/{upload}:
    get:
      operationId: getUpload
      summary: 查询上传进度
      description: |
        返回会话状态与**服务端真实已收块**，客户端的续传依据是这里的结果而不是自己记录的位图
        （design §13.2「查询已收块」）。已收块的哈希与长度都来自持久化记录。
      parameters:
        - name: root
          in: path
          required: true
          description: 授权 Root 的身份（32 位小写十六进制）。
          schema:
            type: string
        - name: upload
          in: path
          required: true
          description: 上传会话身份（32 位小写十六进制）。
          schema:
            type: string
      responses:
        "200":
          description: 会话状态与已收块
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatus"
        "401":
          description: 没有可用会话凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Root 不在调用方授权范围
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: 会话不存在、不属于该 Root 或不属于该登录会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 服务端不可用（例如需要恢复）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/roots/{root}/uploads/{upload}/parts/{index}:
    put:
      operationId: putUploadPart
      summary: 上传一个固定块
      description: |
        按会话的块几何上传第 `index` 块原始字节（design §13.1、§15.2）。请求体是
        `application/octet-stream`；块长度必须等于会话几何给出的期望长度，`x-part-sha256`
        头给出该块的小写十六进制 SHA-256。服务端先把字节落到私有暂存并持久化，再登记该块；
        同一索引重传必须字节一致（幂等返回既有记录），不一致一律拒绝，不能把两个本地
        generation 的字节混进一个会话。
      parameters:
        - name: root
          in: path
          required: true
          description: 授权 Root 的身份（32 位小写十六进制）。
          schema:
            type: string
        - name: upload
          in: path
          required: true
          description: 上传会话身份（32 位小写十六进制）。
          schema:
            type: string
        - name: index
          in: path
          required: true
          description: 块索引（从 0 起的十进制文本）。
          schema:
            type: string
            format: decimal_u64
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "200":
          description: 块已登记（首次或幂等重传）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartAck"
        "400":
          description: 块索引越界、长度与几何不符或载荷超过上限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 没有可用会话凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Root 不在调用方授权范围或会话属于其他登录会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: 会话不存在或不属于该 Root
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: 同一块索引已登记不同字节
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: 块内容与声明的 SHA-256 或长度不符
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 服务端不可用（例如需要恢复）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "507":
          description: 暂存空间不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    UploadRequest:
      description: 创建上传会话的输入（design §15.2 `POST /v1/roots/{root}/uploads`）。
      type: object
      required: [total_size, hash, chunk_size]
      properties:
        total_size:
          type: string
          format: decimal_u64
          description: 不可变本地快照的总字节数（十进制文本）。
        hash:
          type: string
          description: 整份内容的 SHA-256，64 位小写十六进制。
        chunk_size:
          type: string
          format: decimal_u64
          description: |
            客户端希望的块大小（十进制文本）。0 表示由服务端按能力选择；服务端可以把它调到
            自己的上限以内，实际值随会话返回。

    UploadSession:
      description: 上传会话（design §13.1：绑定总大小、总哈希与块几何）。
      type: object
      required:
        [upload_id, root_id, total_size, hash, chunk_size, part_count, state, expires_at]
      properties:
        upload_id:
          type: string
          description: 上传会话身份，32 位小写十六进制。
        root_id:
          type: string
          description: 所属 Root 身份，32 位小写十六进制。
        total_size:
          type: string
          format: decimal_u64
          description: 快照总字节数（十进制文本）。
        hash:
          type: string
          description: 整份内容的 SHA-256，64 位小写十六进制。
        chunk_size:
          type: string
          format: decimal_u64
          description: 本会话实际使用的块大小（十进制文本）。
        part_count:
          type: string
          format: decimal_u64
          description: 块数（空内容为 0）。
        state:
          $ref: "#/components/schemas/UploadState"
          description: 会话状态；客户端据此决定继续传块、查询结果还是放弃。
        expires_at:
          type: string
          format: decimal_u64
          description: 会话到期时间（UTC Unix 秒的十进制文本）。

    UploadState:
      description: |
        上传会话状态闭集。未知取值按协议错误处理；`open` 接收块，`complete` 只等待
        finalize（S046），`finalized`/`aborted` 是终态。
      type: string
      enum:
        - open
        - complete
        - finalized
        - aborted

    UploadStatus:
      description: 续传依据：会话状态加**服务端真实已收块**（design §13.2）。
      type: object
      required: [upload, received, missing]
      properties:
        upload:
          $ref: "#/components/schemas/UploadSession"
          description: 会话状态与块几何。
        received:
          type: array
          description: 已收到的块，按索引升序。
          items:
            $ref: "#/components/schemas/ReceivedPart"
        missing:
          type: array
          description: |
            仍缺失的块区间，按索引升序；空表示块已齐。区间而不是逐块列表，因此长度最多是
            “已收块数 + 1”，不随文件大小增长。
          items:
            $ref: "#/components/schemas/MissingRange"

    ReceivedPart:
      description: 服务端已持久化的一个块。
      type: object
      required: [index, length, hash]
      properties:
        index:
          type: string
          format: decimal_u64
          description: 块索引（从 0 起，十进制文本）。
        length:
          type: string
          format: decimal_u64
          description: 块长度（十进制文本），与块几何一致。
        hash:
          type: string
          description: 块内容的 SHA-256，64 位小写十六进制。

    MissingRange:
      description: 一段连续缺失的块索引。
      type: object
      required: [first_index, count]
      properties:
        first_index:
          type: string
          format: decimal_u64
          description: 区间起点（含），十进制文本。
        count:
          type: string
          format: decimal_u64
          description: 区间内的块数，至少为 1。

    UploadPartAck:
      description: 块登记结果。
      type: object
      required: [upload_id, index, length, hash, state, already_present]
      properties:
        upload_id:
          type: string
          description: 上传会话身份，32 位小写十六进制。
        index:
          type: string
          format: decimal_u64
          description: 块索引（十进制文本）。
        length:
          type: string
          format: decimal_u64
          description: 块长度（十进制文本）。
        hash:
          type: string
          description: 块内容的 SHA-256，64 位小写十六进制。
        state:
          $ref: "#/components/schemas/UploadState"
          description: 登记后的会话状态（块齐之前保持 `open`）。
        already_present:
          type: boolean
          description: 是否为幂等重传（同一索引、同一字节已经登记过）。

    LoginRequest:
      description: 登录请求（design §15.2 `POST /v1/auth/login` 的输入）。
      type: object
      required: [login, password, device_label]
      properties:
        login:
          type: string
          description: 登录名（原样比较，不做大小写折叠）。
        password:
          type: string
          description: 明文密码；只在本次请求内存在，服务端不记录。
        device_label:
          type: string
          description: 设备的人类可读标签（不是设备身份，首发没有设备注册表）。

    RefreshRequest:
      description: 刷新请求（design §15.2 `POST /v1/auth/refresh` 的输入）。
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: 上一次签发的刷新凭据；用一次即失效。

    SessionIssued:
      description: 会话凭据对与有效期；除 `session_id` 外都是秘密，不得写日志或落到前端 localStorage。
      type: object
      required: [session_id, access_token, refresh_token, access_expires_at, refresh_expires_at]
      properties:
        session_id:
          type: string
          description: 会话身份，32 个小写十六进制字符。
        access_token:
          type: string
          description: 访问凭据，放在 Authorization 头的 Bearer 方案里，短期有效。
        refresh_token:
          type: string
          description: 刷新凭据，只能用于 `/v1/auth/refresh` 且用一次即失效。
        access_expires_at:
          type: string
          format: decimal_u64
          description: 访问凭据到期时间（UTC Unix 秒的十进制文本）。
        refresh_expires_at:
          type: string
          format: decimal_u64
          description: 刷新凭据到期时间（UTC Unix 秒的十进制文本）。

    SessionRevoked:
      description: 注销结果。
      type: object
      required: [session_id, revoked_at]
      properties:
        session_id:
          type: string
          description: 被失效的会话身份，32 个小写十六进制字符。
        revoked_at:
          type: string
          format: decimal_u64
          description: 失效时间（UTC Unix 秒的十进制文本）。

    Capabilities:
      description: 协议版本、服务器身份、epoch、功能集合与限额（design §15.2）。
      type: object
      required: [protocol, server_id, epoch, features, limits]
      properties:
        protocol:
          $ref: "#/components/schemas/ProtocolVersion"
          description: 协议主次版本。
        server_id:
          type: string
          description: 服务器身份，32 个小写十六进制字符（design §7.1）。
        epoch:
          type: string
          format: decimal_u64
          description: |
            服务器 epoch 的十进制文本。恢复后更换，客户端据此丢弃旧 epoch 的响应。
        features:
          type: array
          description: |
            服务端支持的功能标记。客户端只使用自己认识的值，未识别的标记按“该功能不可用”
            处理；这里是可扩展标记集合，不是闭集枚举，因此不套用“未知枚举即失败”。
          items:
            type: string
        limits:
          $ref: "#/components/schemas/CapabilityLimits"
          description: 客户端必须遵守的服务端限额。

    ProtocolVersion:
      description: 协议主次版本；主版本不同必须拒绝通信。
      type: object
      required: [major, minor]
      properties:
        major:
          type: integer
          minimum: 0
          maximum: 65535
          description: 主版本；与服务端不同即拒绝通信。
        minor:
          type: integer
          minimum: 0
          maximum: 65535
          description: 次版本；服务端可以更大，客户端按自己认识的功能使用。

    CapabilityLimits:
      description: 客户端必须遵守的服务端限额。
      type: object
      required: [max_page_size, max_upload_part_bytes]
      properties:
        max_page_size:
          type: integer
          minimum: 1
          maximum: 10000
          description: 清单分页的每页上限。
        max_upload_part_bytes:
          type: string
          format: decimal_u64
          description: 单个上传块的最大字节数（十进制文本）。

    HealthResponse:
      description: 健康探测结果。
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
          description: 服务端当前健康状态。

    HealthStatus:
      description: |
        健康状态闭集。客户端遇到未列出的值必须按协议错误处理，不能当作可用。
      type: string
      enum:
        - ok
        - degraded
        - needs_recovery

    ErrorEnvelope:
      description: 错误信封（design §15.4）：所有非 2xx 响应都用它，客户端据此决定重试与暂停。
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
          description: 错误主体。

    ErrorBody:
      description: 错误主体。
      type: object
      required: [code, message, retryable, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
          description: 闭集错误码；未知码不是可重试错误，按协议错误处理。
        message:
          type: string
          description: 面向用户的可理解原因，按数据处理，不当作指令。
        retryable:
          type: boolean
          description: 同一请求稍后原样重试是否可能成功。
        request_id:
          type: string
          description: 服务端记录的请求标识，供日志关联。
        root_id:
          type: string
          description: 相关 Root 的身份（32 个小写十六进制字符）；与 Root 无关时省略。
        details:
          type: object
          description: |
            结构化补充信息，例如 `{"reason": "mount_identity_changed"}`。
          additionalProperties:
            type: string

    ErrorCode:
      description: |
        远端错误码闭集（design §15.4）。未知错误码不能被当成可重试或成功；本机 IPC 专用的
        错误码（LOCAL_CHANGED、FILE_BUSY、MODE_REQUIRES_LOCAL_COPY、PLACEHOLDER_OFFLINE）
        属于 packages/local-ipc-types，不在远端契约内。
      type: string
      enum:
        - AUTH_EXPIRED
        - ACCESS_DENIED
        - BASE_MISMATCH
        - SUBTREE_CHANGED
        - OP_ID_REUSED
        - RECONCILE_REQUIRED
        - CURSOR_EXPIRED
        - EPOCH_CHANGED
        - VERSION_GONE
        - INVALID_NAME
        - INVALID_REQUEST
        - UNSUPPORTED_ENTRY
        - HASH_MISMATCH
        - PART_CONFLICT
        - UNSUPPORTED_STORAGE_BACKEND
        - SERVER_PLACEHOLDER_UNSUPPORTED
        - RATE_LIMITED
        - ROOT_UNAVAILABLE
        - NEEDS_RECOVERY
        - INSUFFICIENT_STORAGE
