  /v1/roots/{root}/entries/{entry}/versions/{version}/content:
    get:
      operationId: downloadVersionContent
      summary: 下载固定版本的内容
      description: |
        按 `(root, entry, version)` 取该版本的**固定**内容字节（design §15.2、I12、I15）：内容地址
        只来自那条版本行，路径上后来出现的新 head 与本请求无关。

        整份请求返回 **200**，带 `Content-Length` 与整份内容的 `x-content-sha256`。请求头
        `Range: bytes=start-end` / `bytes=start-` / `bytes=-suffix` 请求部分内容时返回 **206**
        与 `Content-Range: bytes start-end/total`。多区间、非 `bytes=` 形式、反向区间与越界
        区间一律 400；空对象上的任何区间不可满足。部分切片无法在服务端核对整份摘要
        （design §13.2 的整文件校验在客户端）。

        版本已过期或已清理时返回 410 VERSION_GONE，绝不回退成“同路径的当前内容”。每次读取
        前建立内容租约，读取结束才解除，因此历史对象不会在读取期间被 GC 回收。

        Range 是可选请求头，由调用方经 `init.headers` 传入（可选头不生成函数参数）。
      parameters:
        - name: root
          in: path
          required: true
          description: 授权 Root 的身份（32 位小写十六进制）。
          schema:
            type: string
        - name: entry
          in: path
          required: true
          description: 条目身份（32 位小写十六进制）。
          schema:
            type: string
        - name: version
          in: path
          required: true
          description: 版本身份（32 位小写十六进制）。
          schema:
            type: string
      responses:
        "200":
          description: 整份内容字节（`application/octet-stream`）
          content:
            application/octet-stream: {}
        "206":
          description: 请求区间的字节，`Content-Range` 给出实际区间
          content:
            application/octet-stream: {}
        "400":
          description: Range 头语法不合法，或区间落在对象之外
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 没有可用会话凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Root 不在调用方授权范围
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: 版本已过期、已清理，或不属于该条目/Root（不泄露是否存在）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 服务端不可用（对象读取或租约失败、需要恢复）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

