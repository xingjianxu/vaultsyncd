  /v1/roots/{root}/operations:
    post:
      operationId: submitOperation
      summary: 提交一次修改操作
      description: |
        提交 Put/Create/Move/Delete/Restore 命令之一（design §15.2、§15.3）。命令只引用已上传并
        校验的内容（`upload_id`），不携带字节；服务端按 `(root, device_id, op_id)` 做幂等
        （I06）：

        - 首次出现的 OpId 被登记为 `pending`，命令体随后执行；
        - 同一 OpId 与同一语义再次出现是**重放**：返回记录里的同一结果（`replayed=true`），不重做；
        - 同一 OpId 用于不同语义是协议错误 `OP_ID_REUSED`（409），绝不用旧结果回答新请求；
        - `server_epoch` 不是 Root 当前 epoch 时 410 `EPOCH_CHANGED`，客户端进入保留基线的重建流程；
        - 过期基线的 CAS/子树冲突按 design §15.4 返回 409（`BASE_MISMATCH`/`SUBTREE_CHANGED`/
          `RECONCILE_REQUIRED`）；`preserve_both` 下能提交的过期修改返回 committed 并带 `conflict`。

        响应是本次操作的状态：`committed`/`rejected` 用 200（终态结果稳定），**`pending` 用 202**，
        且 `pending` 不携带 `revision`/`root_seq`/`version_id`/`entry_id`——已受理不等于已同步
        （I01）。响应丢失后的重试必须得到同一份结果。

        本服务端的命令执行链路尚未装配时（见 503 `SERVICE_NOT_READY`），请求不被受理：不登记
        `operations` 行、不追加事件批次、不返回 202。
      parameters:
        - name: root
          in: path
          required: true
          description: 授权 Root 的身份（32 位小写十六进制）。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationRequest"
      responses:
        "200":
          description: 操作已有终态结果（committed 或 rejected）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "202":
          description: 操作已受理但还没有业务结果（pending，不判已同步）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "400":
          description: 请求形状不成立（缺少该命令的前提字段、混用两套命令语义、身份文本非法）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 没有可用会话凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Root 不在调用方授权范围
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: |
            同一 OpId 不同请求（`OP_ID_REUSED`），或条目基线/子树已过期（`BASE_MISMATCH`、
            `SUBTREE_CHANGED`、`RECONCILE_REQUIRED`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: |
            请求的服务器 epoch 已过期（`EPOCH_CHANGED`），或恢复所需的历史/回收站内容已过保留期
            （`VERSION_GONE`，不拿同路径的新内容冒充）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: 名称不可用（`INVALID_NAME`）或条目种类不支持该命令（`UNSUPPORTED_ENTRY`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: |
            Root 当前不可写（`ROOT_UNAVAILABLE`）、存储需要恢复（`NEEDS_RECOVERY`），或本服务端尚未
            装配命令执行器（`SERVICE_NOT_READY`，请求未被受理）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "507":
          description: 服务端空间不足（`INSUFFICIENT_STORAGE`），事务未提交
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/roots/{root}/operations/{op}:
    get:
      operationId: getOperation
      summary: 查询一次操作的结果
      description: |
        按 OpId 取操作结果，用于响应丢失与重启后的恢复（design §15.2）。同一记录的回答与提交端点
        一致：`committed`/`rejected` 用 200 带终态结果，**`pending` 用 202** 且不含修订与序号。

        查询不要求 `server_epoch`：客户端要先知道结果才可能决定是否重建，因此 epoch 变化不影响
        读取既有记录。记录不存在、不属于该 Root 或不属于该登录会话都按同一 404 回答，不泄露是否存在。
      parameters:
        - name: root
          in: path
          required: true
          description: 授权 Root 的身份（32 位小写十六进制）。
          schema:
            type: string
        - name: op
          in: path
          required: true
          description: 客户端生成的逻辑操作身份（32 位小写十六进制）。
          schema:
            type: string
      responses:
        "200":
          description: 操作已有终态结果（committed 或 rejected）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "202":
          description: 操作仍是 pending（已受理、没有业务结果，不判已同步）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "401":
          description: 没有可用会话凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Root 不在调用方授权范围
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: 操作记录不存在、不属于该 Root 或不属于该登录会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 服务端存储不可用或需要恢复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/roots/{root}/snapshots:
    post:
      operationId: createSnapshot
      summary: 创建一致性快照
      description: |
        生成一份短期只读的元数据清单（design §9.3）：服务端在同一个事务里读取 Root 当前的
        `RootSeq`（`high_water_seq`）并复制当时的活跃条目。之后 `…/snapshots/{snapshot}/entries`
        的翻页只读这份清单，与翻页期间的新增/删除/改名无关；客户端应用清单后从
        `changes?after=<high_water_seq>` 继续追赶。

        清单只存活 `expires_at` 之前；每个 Root 同时存在的快照数有上限，超出时最旧的先被回收。
        下载文件内容仍须引用 VersionId，而不是“当前路径”。
      parameters:
        - name: root
          in: path
          required: true
          description: 授权 Root 的身份（32 位小写十六进制）。
          schema:
            type: string
      responses:
        "201":
          description: 快照已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "401":
          description: 没有可用会话凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Root 不在调用方授权范围
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 服务端存储不可用或需要恢复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/roots/{root}/snapshots/{snapshot}/entries:
    get:
      operationId: listSnapshotEntries
      summary: 翻页读取快照清单
      description: |
        只读固定的快照清单（design §9.3），按 EntryId 升序分页。`next_cursor` 缺省表示已是最后一页。

        快照不存在、不属于该 Root 或已过期时返回 410 `CURSOR_EXPIRED`（`details.reason=snapshot_expired`），
        **绝不返回空页或错乱数据**；客户端应重新创建快照并从头翻页。`limit` 超过上限是 400。
      parameters:
        - name: root
          in: path
          required: true
          description: 授权 Root 的身份（32 位小写十六进制）。
          schema:
            type: string
        - name: snapshot
          in: path
          required: true
          description: 快照身份（32 位小写十六进制）。
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: 起始序号（十进制文本）；首页省略，之后用上一页的 `next_cursor`。
          schema:
            type: string
            format: decimal_u64
        - name: limit
          in: query
          required: false
          description: 一页最多返回的条目数（1 至 1000，缺省 500）；越界是 400。
          schema:
            type: string
            format: decimal_u64
      responses:
        "200":
          description: 一页清单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotPage"
        "400":
          description: 游标不是规范十进制、超过清单长度，或 limit 越界
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 没有可用会话凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Root 不在调用方授权范围
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: 快照不存在或已过期（`CURSOR_EXPIRED`），需要重新创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 服务端存储不可用或需要恢复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/roots/{root}/changes:
    get:
      operationId: listChanges
      summary: 拉取有序事务批次
      description: |
        返回 `after` 之后（不含 `after`）的事务批次，严格按 RootSeq 升序（design §9.3）。每个批次是
        一个完整事务：`limit` 只决定在哪个事务边界截断，**绝不把一个事务拆到两页之间**——如果第
        `limit` 个批次与后续批次属于同一个 `tx_id` 且 seq 连续，本页会延伸到把它们取完。

        `after=0` 表示从头开始；新客户端通常用快照的 `high_water_seq` 作为 `after`。`has_more` 为真
        时用 `next_after` 继续拉取。重复拉取同一游标得到同样的批次（拉取没有副作用），客户端按
        seq 去重即可。

        游标早于事件保留窗口（默认 90 天）或晚于服务端当前头时返回 410 `CURSOR_EXPIRED`，
        **不返回空列表**：`details.reason` 为 `before_retention_window` 或 `ahead_of_head`，
        客户端重新获取快照并保留本地基线与未上传队列（design §9.4）。
      parameters:
        - name: root
          in: path
          required: true
          description: 授权 Root 的身份（32 位小写十六进制）。
          schema:
            type: string
        - name: after
          in: query
          required: true
          description: 已处理到的 RootSeq（十进制文本；0 表示从头）。
          schema:
            type: string
            format: decimal_u64
        - name: limit
          in: query
          required: false
          description: 本页至少包含的批次数上限（1 至 500，缺省 100）；越界是 400。
          schema:
            type: string
            format: decimal_u64
      responses:
        "200":
          description: 有序事务批次（可能为空，空表示已追平到读取时的头）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        "400":
          description: "`after` 缺失或不是规范十进制，或 limit 越界"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 没有可用会话凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Root 不在调用方授权范围
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: 游标已失效（`CURSOR_EXPIRED`），需要重新获取快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 服务端存储不可用或需要恢复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/roots/{root}/events:
    get:
      operationId: subscribeEvents
      summary: SSE 唤醒提示
      description: |
        `text/event-stream` 长连接（design §9.3）。**SSE 只是提示，不是数据来源**：事件只说“Root 的
        RootSeq 变了”，不携带批次内容；客户端据此立刻调用 `changes` 拉取。

        每条提示是 `event: seq`，`id` 与 `data`（`SeqHint` 的 JSON）都带当前头。新连接立即收到一条
        当前头的提示；之后头每变化一次提示一次（可能跳号合并）。服务端另发保活注释行。提示可能
        丢失、重复或乱序（断线重连、代理缓冲），客户端不得依赖它的次序或次数——凭 `changes` 的游标
        与 seq 去重修复，断线期间只需轮询 `changes` 即可恢复。

        认证与其他端点相同（`Authorization` 头），因此浏览器原生 `EventSource` 不能直接使用，
        需用 fetch 流式读取。
      parameters:
        - name: root
          in: path
          required: true
          description: 授权 Root 的身份（32 位小写十六进制）。
          schema:
            type: string
      responses:
        "200":
          description: 事件流（`text/event-stream`），`data` 为 `SeqHint` 的 JSON
          content:
            text/event-stream: {}
        "401":
          description: 没有可用会话凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Root 不在调用方授权范围
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 服务端存储不可用或需要恢复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    VersionLeaseRequest:
      description: 固定版本内容租约的稳定请求；身份由调用端随机生成并在重试时复用。
      type: object
      required: [lease_id, sha256, size]
      properties:
        lease_id:
          type: string
          description: 32位小写十六进制租约请求身份。
        sha256:
          type: string
          description: 已提交版本的整份SHA256，小写十六进制。
        size:
          type: string
          format: decimal_u64
          description: 已提交版本的逻辑字节数。
    VersionLease:
      description: 服务器持久化的固定版本保护；expires_at是UTC秒，ttl_seconds是剩余有效秒数。
      type: object
      required: [lease_id, root_id, entry_id, version_id, sha256, size, expires_at, ttl_seconds, closed]
      properties:
        lease_id:
          type: string
          description: 请求租约身份。
        root_id:
          type: string
          description: 固定Root身份。
        entry_id:
          type: string
          description: 固定Entry身份。
        version_id:
          type: string
          description: 固定版本身份。
        sha256:
          type: string
          description: 整份内容SHA256。
        size:
          type: string
          format: decimal_u64
          description: 固定版本字节数。
        expires_at:
          type: string
          format: decimal_u64
          description: UTC到期秒数。
        ttl_seconds:
          type: string
          format: decimal_u64
          description: 响应形成时剩余秒数，最大120。
        closed:
          type: boolean
          description: 显式解除后为true，不可重新续期。
    EntryKind:
      description: 条目种类闭集（design §7.2 `entries.kind`）。未知取值按协议错误处理。
      type: string
      enum:
        - file
        - directory

    Snapshot:
      description: |
        一份一致性快照的元数据（design §9.3）。`high_water_seq` 是创建时刻 Root 的 RootSeq：清单恰好是
        “应用到该 seq 为止”的状态，继续追赶从 `changes?after=<high_water_seq>` 开始。
      type: object
      required: [snapshot_id, root_id, high_water_seq, server_epoch, entry_count, expires_at]
      properties:
        snapshot_id:
          type: string
          description: 快照身份，32 位小写十六进制。
        root_id:
          type: string
          description: 所属 Root 身份，32 位小写十六进制。
        high_water_seq:
          type: string
          format: decimal_u64
          description: 创建快照时的 RootSeq（十进制文本）。
        server_epoch:
          type: string
          format: decimal_u64
          description: 创建快照时 Root 的服务器 epoch（十进制文本）。
        entry_count:
          type: string
          format: decimal_u64
          description: 清单里的条目总数（十进制文本）。
        expires_at:
          type: string
          format: decimal_u64
          description: 清单到期时间（UTC Unix 秒的十进制文本）；此刻及之后翻页返回 410。

    SnapshotEntry:
      description: 快照清单里的一条条目（创建时的值拷贝，不随之后的写入变化）。
      type: object
      required: [entry_id, name, kind, revision]
      properties:
        entry_id:
          type: string
          description: 条目身份，32 位小写十六进制。
        parent_id:
          type: string
          description: 父目录条目身份；Root 的合成根条目没有。
        name:
          type: string
          description: 原始名称（合成根条目为空串）；按数据处理。
        kind:
          $ref: "#/components/schemas/EntryKind"
          description: 文件或目录。
        revision:
          type: string
          format: decimal_u64
          description: 创建快照时的条目 revision（十进制文本）。
        version_id:
          type: string
          description: 当前内容版本身份（只有带内容的文件有）；下载内容引用它而不是路径。
        size:
          type: string
          format: decimal_u64
          description: 当前内容字节数（十进制文本，只有带内容的文件有）。
        hash:
          type: string
          description: 当前内容的 SHA-256，64 位小写十六进制（只有带内容的文件有）。

    SubtreeToken:
      description: |
        目录子树的服务端乐观并发证明（design §10.3、T12）。`token` 覆盖目标条目自身与全部活跃后代
        的身份、父目录、名称、种类与 revision；任一变化都会得到不同的 token。删除时原样回传。
      type: object
      required: [root_id, entry_id, token, entries]
      properties:
        root_id:
          type: string
          description: Root 身份，32 位小写十六进制。
        entry_id:
          type: string
          description: 目录条目身份，32 位小写十六进制。
        token:
          type: string
          description: 子树 token，32 位小写十六进制。
        entries:
          type: string
          format: decimal_u64
          description: 冻结清单里的条目数（含目标自身，十进制文本）。

    SnapshotPage:
      description: 快照清单的一页。
      type: object
      required: [snapshot_id, high_water_seq, entries]
      properties:
        snapshot_id:
          type: string
          description: 快照身份，32 位小写十六进制。
        high_water_seq:
          type: string
          format: decimal_u64
          description: 快照固定的 RootSeq（十进制文本，所有页相同）。
        entries:
          type: array
          description: 本页条目，按 EntryId 升序。
          items:
            $ref: "#/components/schemas/SnapshotEntry"
        next_cursor:
          type: string
          format: decimal_u64
          description: 下一页的游标（十进制文本）；缺省表示已是最后一页。

    ChangeBatch:
      description: 一个事务批次（design §9.3）：RootSeq、TxId 与该事务的全部条目变化。
      type: object
      required: [seq, tx_id, events_json, created_at]
      properties:
        seq:
          type: string
          format: decimal_u64
          description: 批次序号（该 Root 的第 seq 个事务批次，十进制文本）。
        tx_id:
          type: string
          description: 产生该批次的服务端事务身份，32 位小写十六进制。
        events_json:
          type: string
          description: 该事务全部条目变化与冲突关联的 JSON 数组文本；按数据处理，客户端整批原子应用。
        created_at:
          type: string
          format: decimal_u64
          description: 批次提交时间（UTC Unix 秒的十进制文本）。

    ChangeList:
      description: 一页有序事务批次。
      type: object
      required: [root_id, server_epoch, head_seq, next_after, has_more, batches]
      properties:
        root_id:
          type: string
          description: Root 身份，32 位小写十六进制。
        server_epoch:
          type: string
          format: decimal_u64
          description: Root 当前的服务器 epoch（十进制文本）。
        head_seq:
          type: string
          format: decimal_u64
          description: 读取时 Root 的最新 RootSeq（十进制文本）。
        next_after:
          type: string
          format: decimal_u64
          description: 下一次拉取应带的 `after`：本页最后一个批次的 seq；本页为空时等于请求的 `after`。
        has_more:
          type: boolean
          description: 读取时 `next_after` 之后是否还有批次。
        batches:
          type: array
          description: 批次，严格按 seq 升序，每个批次完整。
          items:
            $ref: "#/components/schemas/ChangeBatch"

    SeqHint:
      description: |
        SSE 提示的 `data` 内容（design §9.3）：只告诉客户端 Root 的 RootSeq 已到某个值，
        不携带任何批次内容。丢失、重复、乱序都由 `changes` 拉取修复。
      type: object
      required: [root_id, seq]
      properties:
        root_id:
          type: string
          description: Root 身份，32 位小写十六进制。
        seq:
          type: string
          format: decimal_u64
          description: 提示发出时 Root 的最新 RootSeq（十进制文本）。

    ObjectReuse:
      description: |
        内容对象的发布方式闭集（design §11.2 步骤 7）。`freshly_published` 本次新建，
        `existing_verified` 内容地址上已有同内容对象、未覆盖并复核通过后复用。
      type: string
      enum:
        - freshly_published
        - existing_verified

    FinalizedContent:
      description: |
        finalize 的结果：可提交内容引用（design §15.2 上传 finalize「只生成可提交内容引用，
        不修改条目 head」）。它还不是版本：条目 head 由后续操作按 CAS 提交。
      type: object
      required:
        [upload_id, root_id, hash, size, storage_path, part_count, reuse, replayed]
      properties:
        upload_id:
          type: string
          description: 上传会话身份，32 位小写十六进制。
        root_id:
          type: string
          description: 内容所属 Root 身份，32 位小写十六进制。
        hash:
          type: string
          description: 内容的 SHA-256，64 位小写十六进制；提交时用它引用这份内容。
        size:
          type: string
          format: decimal_u64
          description: 内容字节数（十进制文本）。
        storage_path:
          type: string
          description: |
            对象区内的规范相对路径（服务端内部路径）。客户端只原样回传，不拼接、不解释它。
        part_count:
          type: string
          format: decimal_u64
          description: 块数（十进制文本）。
        reuse:
          $ref: "#/components/schemas/ObjectReuse"
          description: 本次新建还是复用既有对象。
        replayed:
          type: boolean
          description: 是否为幂等重放（会话本来就已经 `finalized`）。
    UploadRequest:
      description: 创建上传会话的输入（design §15.2 `POST /v1/roots/{root}/uploads`）。
      type: object
      required: [total_size, hash, chunk_size]
      properties:
        total_size:
          type: string
          format: decimal_u64
          description: 不可变本地快照的总字节数（十进制文本）。
        hash:
          type: string
          description: 整份内容的 SHA-256，64 位小写十六进制。
        chunk_size:
          type: string
          format: decimal_u64
          description: |
            客户端希望的块大小（十进制文本）。0 表示由服务端按能力选择；服务端可以把它调到
            自己的上限以内，实际值随会话返回。

    UploadSession:
      description: 上传会话（design §13.1：绑定总大小、总哈希与块几何）。
      type: object
      required:
        [upload_id, root_id, total_size, hash, chunk_size, part_count, state, expires_at]
      properties:
        upload_id:
          type: string
          description: 上传会话身份，32 位小写十六进制。
        root_id:
          type: string
          description: 所属 Root 身份，32 位小写十六进制。
        total_size:
          type: string
          format: decimal_u64
          description: 快照总字节数（十进制文本）。
        hash:
          type: string
          description: 整份内容的 SHA-256，64 位小写十六进制。
        chunk_size:
          type: string
          format: decimal_u64
          description: 本会话实际使用的块大小（十进制文本）。
        part_count:
          type: string
          format: decimal_u64
          description: 块数（空内容为 0）。
        state:
          $ref: "#/components/schemas/UploadState"
          description: 会话状态；客户端据此决定继续传块、查询结果还是放弃。
        expires_at:
          type: string
          format: decimal_u64
          description: 会话到期时间（UTC Unix 秒的十进制文本）。

    UploadState:
      description: |
        上传会话状态闭集。未知取值按协议错误处理；`open` 接收块，`complete` 只等待
        finalize（S046），`finalized`/`aborted` 是终态。
      type: string
      enum:
        - open
        - complete
        - finalized
        - aborted

    UploadStatus:
      description: 续传依据：会话状态加**服务端真实已收块**（design §13.2）。
      type: object
      required: [upload, received, missing]
      properties:
        upload:
          $ref: "#/components/schemas/UploadSession"
          description: 会话状态与块几何。
        received:
          type: array
          description: 已收到的块，按索引升序。
          items:
            $ref: "#/components/schemas/ReceivedPart"
        missing:
          type: array
          description: |
            仍缺失的块区间，按索引升序；空表示块已齐。区间而不是逐块列表，因此长度最多是
            “已收块数 + 1”，不随文件大小增长。
          items:
            $ref: "#/components/schemas/MissingRange"

    ReceivedPart:
      description: 服务端已持久化的一个块。
      type: object
      required: [index, length, hash]
      properties:
        index:
          type: string
          format: decimal_u64
          description: 块索引（从 0 起，十进制文本）。
        length:
          type: string
          format: decimal_u64
          description: 块长度（十进制文本），与块几何一致。
        hash:
          type: string
          description: 块内容的 SHA-256，64 位小写十六进制。

    MissingRange:
      description: 一段连续缺失的块索引。
      type: object
      required: [first_index, count]
      properties:
        first_index:
          type: string
          format: decimal_u64
          description: 区间起点（含），十进制文本。
        count:
          type: string
          format: decimal_u64
          description: 区间内的块数，至少为 1。

    UploadPartAck:
      description: 块登记结果。
      type: object
      required: [upload_id, index, length, hash, state, already_present]
      properties:
        upload_id:
          type: string
          description: 上传会话身份，32 位小写十六进制。
        index:
          type: string
          format: decimal_u64
          description: 块索引（十进制文本）。
        length:
          type: string
          format: decimal_u64
          description: 块长度（十进制文本）。
        hash:
          type: string
          description: 块内容的 SHA-256，64 位小写十六进制。
        state:
          $ref: "#/components/schemas/UploadState"
          description: 登记后的会话状态（块齐之前保持 `open`）。
        already_present:
          type: boolean
          description: 是否为幂等重传（同一索引、同一字节已经登记过）。

    OperationKind:
      description: |
        操作命令闭集（design §15.2）。未知取值按协议错误处理，不能当作任一命令执行。
      type: string
      enum:
        - put_content
        - create
        - move
        - delete
        - restore

    ConflictPolicy:
      description: |
        过期基线的冲突策略闭集（design §15.3）。首发只有 `preserve_both`：服务器主条目与冲突副本
        都保留，绝不丢内容。
      type: string
      enum:
        - preserve_both

    OperationState:
      description: |
        操作状态闭集（`operations.state`）。`pending` 只表示已受理，不占 RootSeq、不判已同步；
        `committed` 与 `rejected` 是终态，同一 OpId 的结果不再改变。
      type: string
      enum:
        - pending
        - committed
        - rejected

    ConflictReason:
      description: |
        提交成功但基线与服务器不一致的原因闭集（`preserve_both` 下产生冲突副本）。
      type: string
      enum:
        - stale_base

    OperationConflict:
      description: |
        已提交操作附带的冲突信息（design §15.3）：服务器主条目、新建的冲突副本与原因。内容都在
        服务器上，客户端据此把本地迟到修改对到副本身份上。
      type: object
      required: [entry_id, conflict_entry_id, reason]
      properties:
        entry_id:
          type: string
          description: 服务器主条目的身份，32 位小写十六进制。
        conflict_entry_id:
          type: string
          description: 冲突副本的条目身份，32 位小写十六进制。
        reason:
          $ref: "#/components/schemas/ConflictReason"
          description: 产生副本的原因。

    OperationRequest:
      description: |
        一次修改命令的输入（design §15.3）。`op_id` 与 `device_id` 一起构成幂等键
        `(root, device_id, op_id)`；不同命令用不同字段（put 用 `entry_id`/`base_revision`/
        `upload_id`，create 用 `parent_id`/`name`/`expected_absent`，move 用源
        `entry_id`/`base_revision` 与目标 `parent_id`/`name`，delete 用
        `entry_id`/`base_revision`（目录另带 `subtree_token`），restore 用
        `entry_id`/`base_revision`（`version_id` 表示恢复指定历史版本））。带错字段一律 400，
        同一请求里不允许两套命令语义。
      type: object
      required: [op_id, device_id, server_epoch, kind]
      properties:
        op_id:
          type: string
          description: 客户端生成的逻辑操作身份，32 位小写十六进制；重试必须复用同一个值。
        device_id:
          type: string
          description: |
            发起操作的设备身份，32 位小写十六进制。首发没有设备注册表，它是客户端安装实例自报的
            稳定身份，只用来划定幂等键的范围（design §7.2），不作为授权依据。
        server_epoch:
          type: string
          format: decimal_u64
          description: 客户端事实基础所属的服务器 epoch（十进制文本）。
        kind:
          $ref: "#/components/schemas/OperationKind"
          description: 命令种类。
        entry_id:
          type: string
          description: 被操作或被覆盖的条目身份（put/delete 的目标、move 的源、restore 的条目），32 位小写十六进制。
        base_revision:
          type: string
          format: decimal_u64
          description: 客户端计划时的条目 revision（十进制文本）；过期基线不会被当作最新事实接受。
        base_version_id:
          type: string
          description: 客户端计划时看到的版本身份（可选，32 位小写十六进制）。
        upload_id:
          type: string
          description: 已 finalize 的上传会话身份（put 必填，创建文件时 create 也必填；不带它的 create 创建目录），32 位小写十六进制；内容只通过它引用。
        local_generation:
          type: string
          format: decimal_u64
          description: |
            客户端本地内容代际（十进制文本）。服务器只原样回显供客户端核对，**不**把它当作
            “客户端确实没有后续修改”的证明（design §15.3）。
        conflict_policy:
          $ref: "#/components/schemas/ConflictPolicy"
          description: 过期基线的冲突策略；缺省按 `preserve_both` 处理。
        parent_id:
          type: string
          description: 目标父目录的条目身份（create 必填、move 的目标父目录），32 位小写十六进制。
        name:
          type: string
          description: 目标名称（create 必填、move 的目标名称）；不含路径分隔符。
        expected_absent:
          type: boolean
          description: 新建时声明“目标原本不存在”；create 必须为 true（design §15.3）。
        subtree_token:
          type: string
          description: |
            目录删除的服务端子树 token（32 位小写十六进制）。它由上一条快照/changes 结果给出；
            子树在之后任何变化都让删除返回 409 `SUBTREE_CHANGED`。
        version_id:
          type: string
          description: 恢复指定的历史版本（可选，32 位小写十六进制）；省略表示恢复回收站里的当前形态。

    OperationResult:
      description: |
        一次操作的状态与业务结果（design §15.3）。`pending` 时只有 `op_id`/`state`（可能带
        `echo_local_generation`）：不出现 `revision`/`root_seq`/`version_id`/`entry_id` 一类
        “已完成”字段。`replayed` 由端点按本次请求填写（是否命中了已记录的结果）；`request_id`
        在错误信封里给出，成功响应只带操作身份。
      type: object
      required: [op_id, state]
      properties:
        op_id:
          type: string
          description: 逻辑操作身份，32 位小写十六进制。
        state:
          $ref: "#/components/schemas/OperationState"
          description: 操作状态；`pending` 不代表已同步。
        root_seq:
          type: string
          format: decimal_u64
          description: 该批次占用的 RootSeq（只有 committed 有，十进制文本）。
        entry_id:
          type: string
          description: 业务结果涉及的条目身份（committed 时的目标条目），32 位小写十六进制。
        revision:
          type: string
          format: decimal_u64
          description: 提交后的条目 revision（只有 committed 有，十进制文本）。
        version_id:
          type: string
          description: 提交产生的新版本身份（只有 put/restore 的 committed 有），32 位小写十六进制。
        echo_local_generation:
          type: string
          format: decimal_u64
          description: 原样回显请求里的本地代际（十进制文本），供客户端核对 ACK 属于哪一代。
        conflict:
          $ref: "#/components/schemas/OperationConflict"
          description: committed 且基线与服务器不一致时给出的冲突副本信息。
        replayed:
          type: boolean
          description: 本次响应是否直接来自已记录的结果（响应丢失后的重试为 true）。
        error_code:
          $ref: "#/components/schemas/ErrorCode"
          description: 稳定拒绝时的错误码（只有 rejected 有）。
        error_message:
          type: string
          description: 稳定拒绝的可理解原因（只有 rejected 有，按数据处理）。

    RootHealth:
      description: |
        Root 健康状态闭集（design §7.2 `roots.health`）。`unavailable` 表示挂载、身份或权限
        核对失败，该 Root 暂停同步但绝不据此推导删除。
      type: string
      enum:
        - healthy
        - unavailable

    RootSummary:
      description: 一条授权 Root 的对外摘要；不含服务器绝对路径。
      type: object
      required: [root_id, health]
      properties:
        root_id:
          type: string
          description: Root 身份，32 个小写十六进制字符。
        health:
          $ref: "#/components/schemas/RootHealth"
          description: 当前健康状态。

    RootList:
      description: 授权 Root 清单（design §15.2 `GET /v1/roots`）。
      type: object
      required: [roots]
      properties:
        roots:
          type: array
          description: 当前调用者可见的 Root，按身份顺序稳定排列。
          items:
            $ref: "#/components/schemas/RootSummary"

    RootRegisterRequest:
      description: |
        注册 Root 的输入（design §15.2 `POST /v1/admin/roots`）。这是少数接受服务器绝对路径
        的网络接口之一，因此必须同时受允许基目录与存储准入约束。
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: 服务端绝对路径；必须在部署配置的允许基目录内。

    RootRegistered:
      description: 注册结果（design §15.2）。
      type: object
      required: [root_id, health, pending_import]
      properties:
        root_id:
          type: string
          description: 新 Root 的身份，32 个小写十六进制字符。
        health:
          $ref: "#/components/schemas/RootHealth"
          description: 注册时的健康状态。
        pending_import:
          type: boolean
          description: |
            该 Root 的既有内容是否还没被采集。注册不导入既有文件，因此新注册的 Root 恒为
            true；采集完成后由后续的初始采集步骤推进。


    BrowserSession:
      description: 浏览器只读会话元信息；凭据只在 HttpOnly cookie 中。
      type: object
      required: [session_id, access_expires_at]
      properties:
        session_id: {type: string, description: 会话身份，不是凭据}
        access_expires_at: {type: string, format: decimal_u64, description: 访问会话到期 UTC Unix 秒}

    AccountInfo:
      description: 当前已认证账号，不含凭据。
      type: object
      required: [user_id, login, session_id]
      properties:
        user_id: {type: string, description: 账号身份}
        login: {type: string, description: 登录名}
        session_id: {type: string, description: 会话身份，不是凭据}

    PasswordChangeRequest:
      description: 改密输入；禁止记录明文，沿用初始化密码规则。
      type: object
      required: [current_password, new_password]
      properties:
        current_password: {type: string, description: 当前密码，只在本次请求内存在}
        new_password: {type: string, description: 新密码，沿用初始化密码规则}

    AccountChanged:
      description: 账号操作完成且全部会话已撤销，必须重新登录。
      type: object
      required: [sessions_revoked]
      properties:
        sessions_revoked: {type: string, format: decimal_u64, description: 本次撤销的会话数}


    LoginRequest:
      description: 登录请求（design §15.2 `POST /v1/auth/login` 的输入）。
      type: object
      required: [login, password, device_label]
      properties:
        login:
          type: string
          description: 登录名（原样比较，不做大小写折叠）。
        password:
          type: string
          description: 明文密码；只在本次请求内存在，服务端不记录。
        device_label:
          type: string
          description: 设备的人类可读标签（不是设备身份，首发没有设备注册表）。

    RefreshRequest:
      description: 刷新请求（design §15.2 `POST /v1/auth/refresh` 的输入）。
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: 上一次签发的刷新凭据；用一次即失效。

    SessionIssued:
      description: 会话凭据对与有效期；除 `session_id` 外都是秘密，不得写日志或落到前端 localStorage。
      type: object
      required: [session_id, access_token, refresh_token, access_expires_at, refresh_expires_at]
      properties:
        session_id:
          type: string
          description: 会话身份，32 个小写十六进制字符。
        access_token:
          type: string
          description: 访问凭据，放在 Authorization 头的 Bearer 方案里，短期有效。
        refresh_token:
          type: string
          description: 刷新凭据，只能用于 `/v1/auth/refresh` 且用一次即失效。
        access_expires_at:
          type: string
          format: decimal_u64
          description: 访问凭据到期时间（UTC Unix 秒的十进制文本）。
        refresh_expires_at:
          type: string
          format: decimal_u64
          description: 刷新凭据到期时间（UTC Unix 秒的十进制文本）。

    SessionRevoked:
      description: 注销结果。
      type: object
      required: [session_id, revoked_at]
      properties:
        session_id:
          type: string
          description: 被失效的会话身份，32 个小写十六进制字符。
        revoked_at:
          type: string
          format: decimal_u64
          description: 失效时间（UTC Unix 秒的十进制文本）。

    Capabilities:
      description: 协议版本、服务器身份、epoch、功能集合与限额（design §15.2）。
      type: object
      required: [protocol, server_id, epoch, features, limits]
      properties:
        protocol:
          $ref: "#/components/schemas/ProtocolVersion"
          description: 协议主次版本。
        server_id:
          type: string
          description: 服务器身份，32 个小写十六进制字符（design §7.1）。
        epoch:
          type: string
          format: decimal_u64
          description: |
            服务器 epoch 的十进制文本。恢复后更换，客户端据此丢弃旧 epoch 的响应。
        features:
          type: array
          description: |
            服务端支持的功能标记。客户端只使用自己认识的值，未识别的标记按“该功能不可用”
            处理；这里是可扩展标记集合，不是闭集枚举，因此不套用“未知枚举即失败”。
          items:
            type: string
        limits:
          $ref: "#/components/schemas/CapabilityLimits"
          description: 客户端必须遵守的服务端限额。

    ProtocolVersion:
      description: 协议主次版本；主版本不同必须拒绝通信。
      type: object
      required: [major, minor]
      properties:
        major:
          type: integer
          minimum: 0
          maximum: 65535
          description: 主版本；与服务端不同即拒绝通信。
        minor:
          type: integer
          minimum: 0
          maximum: 65535
          description: 次版本；服务端可以更大，客户端按自己认识的功能使用。

    CapabilityLimits:
      description: 客户端必须遵守的服务端限额。
      type: object
      required: [max_page_size, max_upload_part_bytes]
      properties:
        max_page_size:
          type: integer
          minimum: 1
          maximum: 10000
          description: 清单分页的每页上限。
        max_upload_part_bytes:
          type: string
          format: decimal_u64
          description: 单个上传块的最大字节数（十进制文本）。

    RecoveryItem:
      type: object
      description: 历史或回收站中的可选恢复目标；恢复时仍须复核权限、版本保留和当前修订。
      required: [id, entry_id, name, revision]
      properties:
        id: {type: string, description: 分页稳定身份，历史为版本身份，回收站为条目身份。}
        entry_id: {type: string, description: 原条目身份。}
        name: {type: string, description: 当前名称或回收站原相对路径。}
        revision: {type: string, description: 当前条目修订，恢复提交的 CAS 基础。}
        parent_id: {type: string, description: 原父目录身份。}
        version_id: {type: string, description: 固定内容版本，目录省略。}
        hash: {type: string, description: 固定版本摘要，目录省略。}
        size: {type: string, description: 固定版本字节数，目录省略。}
    RecoveryPage:
      type: object
      description: 有界恢复项目清单；不是同步状态快照，重复或丢失时重新查询。
      required: [items]
      properties:
        items:
          type: array
          description: 按身份升序的一页，最多100条。
          items: {$ref: "#/components/schemas/RecoveryItem"}
        next_cursor: {type: string, description: 下一页 after 身份；没有下一页时省略。}
    HealthResponse:
      description: 健康探测结果。
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
          description: 服务端当前健康状态。

    HealthStatus:
      description: |
        健康状态闭集。客户端遇到未列出的值必须按协议错误处理，不能当作可用。
      type: string
      enum:
        - ok
        - degraded
        - needs_recovery

    ErrorEnvelope:
      description: 错误信封（design §15.4）：所有非 2xx 响应都用它，客户端据此决定重试与暂停。
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
          description: 错误主体。

    ErrorBody:
      description: 错误主体。
      type: object
      required: [code, message, retryable, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
          description: 闭集错误码；未知码不是可重试错误，按协议错误处理。
        message:
          type: string
          description: 面向用户的可理解原因，按数据处理，不当作指令。
        retryable:
          type: boolean
          description: 同一请求稍后原样重试是否可能成功。
        request_id:
          type: string
          description: 服务端记录的请求标识，供日志关联。
        root_id:
          type: string
          description: 相关 Root 的身份（32 个小写十六进制字符）；与 Root 无关时省略。
        details:
          type: object
          description: |
            结构化补充信息，例如 `{"reason": "mount_identity_changed"}`。
          additionalProperties:
            type: string

    ErrorCode:
      description: |
        远端错误码闭集（design §15.4）。未知错误码不能被当成可重试或成功；本机 IPC 专用的
        错误码（LOCAL_CHANGED、FILE_BUSY、MODE_REQUIRES_LOCAL_COPY、PLACEHOLDER_OFFLINE）
        属于 packages/local-ipc-types，不在远端契约内。

        SERVICE_NOT_READY 是“服务端这一版还没有装配该端点所需的执行链路”的显式拒绝（本卡起用于
        操作命令端点），与 NEEDS_RECOVERY 的“意图无法解释、需要人工介入”不是一回事；它待与
        docs/design.md §15.4 的表格同步。
      type: string
      enum:
        - AUTH_EXPIRED
        - ACCESS_DENIED
        - BASE_MISMATCH
        - SUBTREE_CHANGED
        - OP_ID_REUSED
        - RECONCILE_REQUIRED
        - CURSOR_EXPIRED
        - EPOCH_CHANGED
        - VERSION_GONE
        - INVALID_NAME
        - INVALID_REQUEST
        - UNSUPPORTED_ENTRY
        - HASH_MISMATCH
        - PART_CONFLICT
        - UNSUPPORTED_STORAGE_BACKEND
        - SERVER_PLACEHOLDER_UNSUPPORTED
        - RATE_LIMITED
        - ROOT_UNAVAILABLE
        - NEEDS_RECOVERY
        - INSUFFICIENT_STORAGE
        - SERVICE_NOT_READY
