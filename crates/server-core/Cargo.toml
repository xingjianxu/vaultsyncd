[package]
name = "vaultsyncd-server-core"
description = "服务端用例核心：不可变内容对象的写入/读取规则、提交意图状态机与恢复判定（docs/design.md §5.4、§11.1—11.3、I12）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 本 crate 只做规则与顺序编排，不直接访问文件系统（design §5.5）：字节操作由
# `ports::object_store::ObjectBlobPort`/`ports::target::TargetPort` 的适配器实现，意图持久化由
# `ports::intent_log::IntentLog` 的实现（服务端存储层）负责。身份与时间戳只在 crates/domain 定义
# （design §5.4、§7.1），这里直接用它的类型，不另造一套 id/时间表示。除 domain 外没有第三方依赖，
# 也不依赖平台适配层，任何宿主目标都能编译与测试。
[lints]
workspace = true

[dependencies]
vaultsyncd-domain = { path = "../domain" }
# 密码散列用 Argon2id（design §17.1、[R12] RFC 9106）：这是本项目允许自行引入密码学库的唯一位置。
# `password-hash` 提供 PHC 文本与盐生成，`rand` 把操作系统的随机源接进来（盐必须是真随机）。
argon2 = { version = "0.5", features = ["password-hash", "rand"] }
# `argon2` 只能生成“确定性的”盐，真随机盐要 `OsRng`；`password-hash` 再导出的 `OsRng` 属于
# `rand_core` 的 `getrandom` feature，而 `argon2` 自己不开它。这里直接依赖在同一 0.6 线上只为了启用
# feature（Cargo 的 feature 是并集），代码仍从 `argon2::password_hash::rand_core` 取 `OsRng`，
# 避免项目里出现两个 rand 类型。
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
# 意图状态机是异步端口（服务端存储层是异步 SQLx）：测试用 `#[tokio::test]` 驱动内存假端口。
tokio = { version = "1", features = ["macros", "rt"] }
