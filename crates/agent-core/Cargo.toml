[package]
name = "vaultsyncd-agent-core"
description = "客户端 agent 核心：端口契约与确定性操作执行器（docs/design.md §5.4、§5.5、§8.4、§13.3）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 客户端应用服务核心（design §5.4 `crates/agent-core`）：计划执行、依赖调度、本地写入意图，
# 以及文件/平台、时钟、远端、持久状态四类端口。**不做平台 I/O**（design §5.5）：文件系统、
# HTTP 与 SQLite 都在端口后面，由 `adapters` 或应用入口组装；Linux 同步客户端产品不在这里
# 生成，测试用的假端口只在 `cfg(test)` 下编译。
#
# 依赖方向：只依赖 domain/fs-common/planner/protocol/transfer/client-store 与端口接口，
# 不依赖 server-core、server-store 或 Tauri（design §5.5）。
[dependencies]
vaultsyncd-client-store = { path = "../client-store" }
vaultsyncd-domain = { path = "../domain" }
vaultsyncd-fs-common = { path = "../fs-common" }
vaultsyncd-planner = { path = "../planner" }
# 远端操作端口直接使用 wire 契约生成的 `OperationRequest`/`OperationResult`（S024），不另造一套
# 操作 DTO，避免客户端与服务端对同一命令出现两种形状。
vaultsyncd-protocol = { path = "../protocol" }
# 传输执行器（S054）的端口、块几何与摘要类型只在 `crates/transfer` 定义一份；本 crate 的
# 上传/下载续传端口直接复用它们。
vaultsyncd-transfer = { path = "../transfer" }
# 适配器把状态端口接到客户端 SQLite（design §7.3）：只用到连接池与短事务，SQLx 的 bundled
# SQLite 与迁移仍由 `crates/client-store` 唯一负责，这里不新增 schema 逻辑。
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
# 首次绑定的内部持久日志；不为 wire DTO 维护第二份定义。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# 端口与执行器是异步接口：测试用 `#[tokio::test]` 驱动（产品代码不依赖运行时）。
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
