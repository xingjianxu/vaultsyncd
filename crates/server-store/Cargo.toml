[package]
name = "vaultsyncd-server-store"
description = "服务端 SQLite 存储：数据库种类与 schema 版本门禁、迁移执行与短事务接口（docs/design.md §5.4、§7.2、§19.3）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 依赖只落在服务端持久化这一层：SQLite 访问与迁移用 SQLx（design §4.1「元数据 | SQLite，
# SQLx migrations」），运行时用 Tokio（design §4.1「异步与服务端 | Tokio、Axum、Serde」）。
# `sqlite` feature 通过 libsqlite3-sys 的 bundled 源编译 SQLite，因此不用系统 libsqlite3、
# 也不依赖 devShell 里的 nixpkgs sqlite 版本；`macros` 只为 `sqlx::migrate!` 编译期内嵌
# migrations/ 目录，不使用 `query!`（因此不需要 DATABASE_URL 或 SQLX_OFFLINE）。
[dependencies]
# 与SQLx共享libsqlite3-sys 0.30，安全调用Online Backup API。
rusqlite = { version = "0.32.1", features = ["backup", "bundled"] }
tokio = { version = "1", features = ["sync"] }
# 身份、计数与 UTC 时间只在 crates/domain 定义（design §5.4、§7.1），本 crate 直接用它的类型，
# 不另造一套 id/seq 表示；名称的跨平台可表示性判定属 crates/fs-common 的纯规则（design §16.1），
# 条目名称在写库前用它校验，避免把不可跨端表示的名称存进服务端命名空间。
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
    "derive",
] }
# 状态目录互斥锁（`state_lock`）用操作系统的文件锁：标准库的 `File::try_lock` 从 Rust 1.89 起才
# 稳定，而 workspace `rust-version` 仍是 1.85.0，因此用 `fs2` 的 `FileExt`（unix 走 flock、
# windows 走 LockFileEx，不把 unsafe 代码带进本 crate）。
fs2 = "0.4"
# 请求摘要用 SHA-256：与内容哈希（design §7.1 `ContentHash`）同一算法，避免项目里出现两套摘要惯例。
# 该版本已由 sqlx 传递引入（Cargo.lock 已有 `sha2 0.10.9`），这里只是增加一条直接依赖边。
sha2 = "0.10"
vaultsyncd-domain = { path = "../domain" }
vaultsyncd-fs-common = { path = "../fs-common" }
# 块几何（块数/每块长度）只在传输层定义一份（design §5.4 的 `crates/transfer`、§13.1）：客户端上传
# 与服务端接收必须按同一个定义切块，存储层只把那份几何映射成自已的错误枚举，不另写除法。
vaultsyncd-transfer = { path = "../transfer" }
# GC 适配器返回核心引用事实；依赖单向，server-core 不依赖存储实现。
vaultsyncd-server-core = { path = "../server-core" }

[dev-dependencies]
serde_json = "1"
# 迁移测试是真实 SQLite 文件的异步测试：`#[tokio::test]` 与多线程 runtime 由测试侧提供。
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
