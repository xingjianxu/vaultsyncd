[package]
name = "vaultsyncd-admin"
description = "服务端管理命令：离线 owner 初始化与受限 Unix socket 在线管理"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "vaultsyncd-admin"
path = "src/main.rs"

# 管理命令仅离线 init 持有数据库锁；在线命令只能连接服务进程的受限 Unix socket。
# 本包与服务端一样只在 Linux 上编译，不进 default-members。
#
# 密码从 stdin 读（终端下不回显，用 `rpassword` 关闭回显），**不接受命令行参数**：argv 会出现在
# 进程列表与 shell 历史里。
[dependencies]
rpassword = "7"
# 账号身份用操作系统随机源（`OsRng`）生成；与 server-core 的密码盐同一个 rand_core 0.6 线。
rand_core = { version = "0.6", features = ["getrandom"] }
# 账号适配器直接持有 `server-store` 打开的写事务，因此需要 sqlx 的 `Transaction` 类型。
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
serde_json = "1"
vaultsyncd-platform-linux-server = { path = "../../crates/platform-linux-server" }
vaultsyncd-domain = { path = "../../crates/domain" }
vaultsyncd-server-core = { path = "../../crates/server-core" }
vaultsyncd-server-store = { path = "../../crates/server-store" }

[dev-dependencies]
# 进程级验收要直接读回数据库里的账号行，证明“写入的是 Argon2id 散列、且只有一行”。
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
