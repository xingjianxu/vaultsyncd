[package]
name = "vaultsyncd-agent"
description = "Windows agent application assembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
vaultsyncd-fs-common = { path = "../../crates/fs-common" }
vaultsyncd-agent-core = { path = "../../crates/agent-core" }
vaultsyncd-client-store = { path = "../../crates/client-store" }
vaultsyncd-domain = { path = "../../crates/domain" }
vaultsyncd-local-ipc = { path = "../../crates/local-ipc" }
vaultsyncd-http-client = { path = "../../crates/http-client" }
vaultsyncd-platform-windows = { path = "../../crates/platform-windows" }
vaultsyncd-transfer = { path = "../../crates/transfer" }
vaultsyncd-protocol = { path = "../../crates/protocol" }
vaultsyncd-planner = { path = "../../crates/planner" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[lints]
workspace = true
