[package]
name = "vaultsyncd-desktop"
description = "Windows Tauri shell: typed local agent IPC only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
native-acceptance = ["tauri/dynamic-acl"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
rand_core = { version = "0.6", features = ["getrandom"] }
vaultsyncd-release-client = { path = "../../../crates/release-client" }
vaultsyncd-local-ipc = { path = "../../../crates/local-ipc" }
vaultsyncd-platform-windows = { path = "../../../crates/platform-windows" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
