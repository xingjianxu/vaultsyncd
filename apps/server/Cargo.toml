[package]
name = "vaultsyncd-server"
description = "Linux 服务端进程入口：配置、日志、依赖组装、启动恢复门与优雅停止（docs/design.md §4.2、§5.3、§17.2）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "vaultsyncd-server"
path = "src/main.rs"

# 服务端只在 Linux 运行（design §4.2、§17.2）：本包在非 Linux 目标上直接 `compile_error!`，
# 因此不进 workspace `default-members`，便携检查（含 Windows 默认目标）不构建它。
#
# 依赖只落在“进程装配”这一层：HTTP 用 Axum（design §4.1「异步与服务端 | Tokio、Axum、Serde」），
# 运行时用 Tokio，结构化日志用 tracing（design §4.1「日志 | tracing」、§18.3），配置用 TOML。
# 不引入 FUSE/CFAPI 相关依赖：服务端不需要 `/dev/fuse`，也不链接 Windows 适配层。
[dependencies]
tower-http = { version = "0.6", features = ["fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "fs", "io-util"] }
# SSE 提示流用 `stream::unfold` 把“轮询 RootSeq”的异步循环变成事件流（design §9.3）；与 axum 用同一条 futures 线。
futures-util = { version = "0.3", default-features = false }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
toml = "0.9"
# 操作端点要把操作记录里保存的紧凑结果（wire OperationResult 的 JSON）解析回 DTO 再原样回答。
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
# 会话凭据与身份来自 OS 随机源（design §17.1）：与 server-core 使用同一条 rand_core 0.6 依赖线。
rand_core = { version = "0.6", features = ["getrandom"] }
vaultsyncd-domain = { path = "../../crates/domain" }
vaultsyncd-fs-common = { path = "../../crates/fs-common" }
vaultsyncd-platform-linux-server = { path = "../../crates/platform-linux-server" }
vaultsyncd-planner = { path = "../../crates/planner" }
vaultsyncd-protocol = { path = "../../crates/protocol" }
vaultsyncd-server-core = { path = "../../crates/server-core" }
vaultsyncd-server-store = { path = "../../crates/server-store" }

[dev-dependencies]
# HTTP 处理器与上传端点的验收用 `tower::ServiceExt::oneshot` 直接调用 router，不启动真实监听。
tower = { version = "0.5", features = ["util"] }
# 验收用例按生成 DTO 解析响应体（不手写 JSON 字面量比对），并按契约形状断言已收块/缺块区间；
# serde_json 同时也是运行时依赖（见 [dependencies]），这里不重复声明。
# 块摘要由传输层的唯一实现给出（design §5.4）：测试不复刻一份 SHA-256。
vaultsyncd-transfer = { path = "../../crates/transfer" }
[lints]
workspace = true
