[package]
name = "vaultsyncd-xtask"
description = "vaultsyncd 的构建、生成、检查与发布编排入口（docs/design.md §5.2）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 二进制名固定为 xtask，与根 .cargo/config.toml 的 alias 对应：`cargo xtask <子命令>`。
[[bin]]
name = "xtask"
path = "src/main.rs"

# 协议生成需要解析 YAML/JSON 契约与 TOML 生成配置（S024、S025）。这里只引入解析器，不用模板
# 引擎：生成逻辑留在本包内，输出形状由 api/generation.toml 的版本、映射与路径声明约束。
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "0.9"

[lints]
workspace = true
