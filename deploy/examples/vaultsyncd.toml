# vaultsyncd 服务端最小配置示例（docs/design.md §5.9、§5.10）。
#
# 这是**示例**，不含任何真实路径以外的凭据：真实配置放在 /etc/vaultsyncd/vaultsyncd.toml
# （或由容器映射到其他位置），不进入 Git。服务端只用普通目录，不挂载 FUSE 视图，也不需要
# /dev/fuse 或特权容器（design §11.4、§17.2）。
#
# 加载规则：未知键、未知日志级别、不能解析的监听地址、不存在或非绝对路径的状态目录一律拒绝启动
# （退出码 2），不会用默认值兜过去。

[server]
# 只监听回环地址，端口与常见开发服务分开：默认值即 127.0.0.1:8721。
# 对外提供服务时由同机反向代理以 HTTPS 进入（design §17.2），或显式改成实际网卡地址。
listen = "127.0.0.1:8721"

[state]
# 服务端内部状态目录：数据库 server.sqlite（以及后续的对象、暂存、意图目录）都在这里，
# 与用户数据目录分开。目录必须事先存在，服务端不替你决定它落在哪个文件系统上。
dir = "/var/lib/vaultsyncd"

[log]
# trace / debug / info / warn / error；text 便于 journalctl 阅读，json 便于采集。
level = "info"
format = "text"
